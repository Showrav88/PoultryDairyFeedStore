<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Updating — Poultry Feed Store</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #ecfdf5 0%, #f0fdf4 50%, #ffffff 100%);
      color: #14532d;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: #fff;
      border: 1px solid #bbf7d0;
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 8px 30px rgba(16, 185, 129, 0.12);
      text-align: center;
    }
    h1 { font-size: 1.35rem; margin-bottom: 12px; }
    p { font-size: 0.95rem; line-height: 1.55; color: #166534; margin-bottom: 8px; }
    .muted { font-size: 0.85rem; color: #4ade80; margin-top: 16px; }
    .status { font-size: 0.8rem; color: #059669; margin-top: 12px; min-height: 1.2em; }
    .actions { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 16px;
      border-radius: 10px;
      border: 1px solid #059669;
      background: #059669;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    .btn.secondary {
      background: #fff;
      color: #059669;
    }
    .spinner {
      width: 40px; height: 40px; margin: 20px auto;
      border: 3px solid #bbf7d0; border-top-color: #059669;
      border-radius: 50%; animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" aria-hidden="true"></div>
    <h1>App is updating</h1>
    <p>We are deploying a new version. This usually takes <strong>a few minutes</strong>.</p>
    <p>This page checks automatically — you will be redirected when the app is ready.</p>
    <p class="status" id="status" role="status">Checking server…</p>
    <div class="actions">
      <button type="button" class="btn" id="openApp">Open app now</button>
      <button type="button" class="btn secondary" id="hardRefresh">Hard refresh</button>
    </div>
    <p class="muted">Your data is safe. Stock and accounts are unchanged during updates.</p>
  </div>
  <script>
    (function () {
      var statusEl = document.getElementById("status");
      var pollMs = 2500;
      var checks = 0;
      var readyStreak = 0;

      function setStatus(msg) {
        if (statusEl) statusEl.textContent = msg;
      }

      function clearServiceWorkers() {
        if (!("serviceWorker" in navigator)) return Promise.resolve();
        return navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
        }).catch(function () {});
      }

      function appReady(data) {
        if (!data) return false;
        if (data.appReady === true) return true;
        if (data.appReady === false) return false;
        if (data.status !== "ok" || data.database !== "connected") return false;
        if (data.deployRunning === true) return false;
        var state = data.deployState || "";
        if (state === "building" || state === "restarting" || state === "pulling" || state === "started" || state === "running") {
          return false;
        }
        return true;
      }

      function goHome() {
        setStatus("Ready — opening app…");
        clearServiceWorkers().finally(function () {
          window.location.replace("/?_=" + Date.now());
        });
      }

      async function checkHealth() {
        checks += 1;
        try {
          var res = await fetch("/api/health?_=" + Date.now(), {
            method: "GET",
            cache: "no-store",
            headers: { Accept: "application/json", "Cache-Control": "no-cache" },
          });

          if (res.ok) {
            var ct = res.headers.get("content-type") || "";
            if (ct.indexOf("application/json") !== -1) {
              var data = await res.json();
              if (appReady(data)) {
                readyStreak += 1;
                if (readyStreak >= 2) {
                  goHome();
                  return;
                }
                setStatus("App is ready — opening…");
              } else {
                readyStreak = 0;
                if (data.deployRunning || data.deployState === "building" || data.deployState === "restarting") {
                  setStatus("Build in progress…");
                } else if (data.status === "ok") {
                  setStatus("Server responding — finishing up…");
                } else {
                  setStatus("Waiting for app…");
                }
              }
            } else {
              readyStreak = 0;
              setStatus("Waiting for app…");
            }
          } else if (res.status === 502 || res.status === 503) {
            readyStreak = 0;
            setStatus("App is restarting…");
          } else {
            readyStreak = 0;
            setStatus("Checking again…");
          }
        } catch (e) {
          readyStreak = 0;
          setStatus(checks <= 2 ? "App is restarting…" : "Still updating — retrying…");
        }

        setTimeout(checkHealth, pollMs);
      }

      document.getElementById("openApp").addEventListener("click", function () {
        goHome();
      });

      document.getElementById("hardRefresh").addEventListener("click", function () {
        clearServiceWorkers().finally(function () {
          window.location.reload(true);
        });
      });

      clearServiceWorkers();
      checkHealth();
    })();
  </script>
</body>
</html>
