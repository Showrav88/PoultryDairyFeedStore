<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="refresh" content="30" />
  <title>Updating — Poultry Feed Store</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #ecfdf5 0%, #f0fdf4 50%, #ffffff 100%);
      color: #14532d;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: #fff;
      border: 1px solid #bbf7d0;
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 8px 30px rgba(16, 185, 129, 0.12);
      text-align: center;
    }
    h1 { font-size: 1.35rem; margin-bottom: 12px; }
    p { font-size: 0.95rem; line-height: 1.55; color: #166534; margin-bottom: 8px; }
    .muted { font-size: 0.85rem; color: #4ade80; margin-top: 16px; }
    .spinner {
      width: 40px; height: 40px; margin: 20px auto;
      border: 3px solid #bbf7d0; border-top-color: #059669;
      border-radius: 50%; animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" aria-hidden="true"></div>
    <h1>App is updating</h1>
    <p>We are deploying a new version. This usually takes <strong>10–20 minutes</strong>.</p>
    <p>Please wait and refresh — this page reloads automatically every 30 seconds.</p>
    <p class="muted">Your data is safe. Stock and accounts are unchanged during updates.</p>
  </div>
</body>
</html>
