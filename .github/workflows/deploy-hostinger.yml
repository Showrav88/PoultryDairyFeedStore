name: Deploy to Hostinger VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: newproject-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate deployment secrets
        env:
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          VPS_DEPLOY_URL: ${{ secrets.VPS_DEPLOY_URL }}
        run: |
          missing=()
          [ -z "$DEPLOY_WEBHOOK_SECRET" ] && missing+=("DEPLOY_WEBHOOK_SECRET")
          [ -z "$VPS_DEPLOY_URL" ] && missing+=("VPS_DEPLOY_URL")

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing GitHub Actions secrets: ${missing[*]}"
            exit 1
          fi

      - name: Trigger VPS deploy and wait for health
        env:
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          VPS_DEPLOY_URL: ${{ secrets.VPS_DEPLOY_URL }}
        run: |
          set -euo pipefail
          BASE_URL="${VPS_DEPLOY_URL%/api/deploy}"
          HEALTH_URL="${BASE_URL}/api/health"
          STATUS_URL="${BASE_URL}/api/deploy/status"
          short_github_sha="${GITHUB_SHA:0:7}"
          last_webhook_attempt=0
          webhook_fires=0

          fire_webhook() {
            webhook_fires=$((webhook_fires + 1))
            echo "Webhook attempt ${webhook_fires} (commit ${short_github_sha}) ..."
            local attempt_num=1
            local response="" code="" body=""
            while [[ "$attempt_num" -le 3 ]]; do
              response=$(curl -sS --connect-timeout 30 --max-time 60 -w "\nHTTP_CODE:%{http_code}" -X POST "$VPS_DEPLOY_URL" \
                -H "Authorization: Bearer ${DEPLOY_WEBHOOK_SECRET}" \
                -H "Content-Type: application/json" \
                -d "{\"ref\":\"${GITHUB_REF}\",\"sha\":\"${GITHUB_SHA}\"}" 2>&1 || true)

              body="${response%HTTP_CODE:*}"
              code="${response##*HTTP_CODE:}"
              if [[ "$code" == "202" || "$code" == "200" ]]; then
                echo "HTTP ${code:-000}"
                echo "$body"
                return 0
              fi

              if [[ "$body" == *"Timeout"* || "$body" == *"timed out"* || "$code" == "000" ]]; then
                echo "Webhook transport attempt ${attempt_num}/3 failed (HTTP ${code:-000}) — retrying in 5s ..."
                sleep 5
                attempt_num=$((attempt_num + 1))
                continue
              fi

              echo "HTTP ${code:-000}"
              echo "$body"
              return 1
            done
            echo "Webhook failed after 3 transport attempts"
            return 1
          }

          echo "Deploying commit ${GITHUB_SHA} via webhook (+ VPS cron backup every 5 min)"
          fire_webhook || echo "::warning::Initial webhook failed — VPS cron auto-deploy may still deploy within 5–10 minutes"

          echo "Waiting for deploySha=${short_github_sha} (webhook + cron, up to 40 min) ..."

          for attempt in $(seq 1 240); do
            # Re-fire webhook only when nothing is actively deploying (avoid refreshing stale "running")
            if [[ "$attempt" -eq 36 || ( "$attempt" -gt 36 && "$(( attempt % 60 ))" -eq 0 ) ]]; then
              health_quick=$(curl -sS --connect-timeout 5 --max-time 8 "$HEALTH_URL" 2>/dev/null || echo "")
              current_quick=$(echo "$health_quick" | jq -r '.deploySha // empty' 2>/dev/null || true)
              running_quick=$(echo "$health_quick" | jq -r '.deployRunning // false' 2>/dev/null || true)
              if [[ "$current_quick" != "$short_github_sha" && "$running_quick" != "true" ]]; then
                echo "No progress at attempt ${attempt} (deploy not running) — re-triggering webhook ..."
                fire_webhook || echo "Webhook re-trigger failed; cron may still deploy"
              elif [[ "$running_quick" == "true" ]]; then
                echo "Deploy still active at attempt ${attempt} — waiting (no duplicate webhook)"
              fi
            fi

            health_curl=$(curl -sS --connect-timeout 5 --max-time 10 -w "\nHTTP_CODE:%{http_code}" "$HEALTH_URL" 2>/dev/null || echo "HTTP_CODE:000")
            health_body="${health_curl%HTTP_CODE:*}"
            health_code="${health_curl##*HTTP_CODE:}"
            health_json=""
            if [[ "$health_code" == "200" && -n "$health_body" ]]; then
              health_json="$health_body"
            fi

            status_curl=$(curl -sS --connect-timeout 5 --max-time 10 -w "\nHTTP_CODE:%{http_code}" "$STATUS_URL" 2>/dev/null || echo "HTTP_CODE:000")
            status_body="${status_curl%HTTP_CODE:*}"
            status_code="${status_curl##*HTTP_CODE:}"
            status_json=""
            if [[ "$status_code" == "200" && -n "$status_body" ]]; then
              status_json="$status_body"
            fi

            app_offline="false"
            if [[ "$health_code" == "000" || "$health_code" == "502" || "$health_code" == "503" ]]; then
              app_offline="true"
            fi

            if [[ -n "$health_json" ]]; then
              if [[ "$attempt" == "1" || "$(( attempt % 12 ))" == "0" ]]; then
                echo "$health_json"
              fi
              deployed_sha=$(echo "$health_json" | jq -r '.deploySha // empty')
              deploy_state=$(echo "$health_json" | jq -r '.deployState // empty')
              health_deploy_running=$(echo "$health_json" | jq -r '.deployRunning // empty')
            else
              deployed_sha=""
              deploy_state=""
              health_deploy_running=""
            fi

            status_sha=""
            status_state=""
            deploy_running="false"
            if [[ -n "$status_json" ]]; then
              status_sha=$(echo "$status_json" | jq -r '.deployStatus.sha // empty')
              status_state=$(echo "$status_json" | jq -r '.deployStatus.state // empty')
              deploy_running=$(echo "$status_json" | jq -r '.deployRunning // false')
              if [[ "$health_deploy_running" == "true" || "$health_deploy_running" == "false" ]]; then
                deploy_running="$health_deploy_running"
              fi
              if [[ "$attempt" == "1" || "$(( attempt % 12 ))" == "0" ]]; then
                echo "$status_json" | jq -c '{deploySha, deployRunning, deployStatus}' 2>/dev/null || echo "$status_json"
              fi
            fi

            if [[ "$deploy_state" == "failed" || "$status_state" == "failed" ]]; then
              echo "::warning::Deploy reported failed — waiting for cron retry ..."
            fi

            health_ok=$(echo "$health_json" | jq -r '.status // empty')

            if [[ "$deployed_sha" == "$short_github_sha" ]]; then
              if [[ "$deploy_state" == "ready" || "$status_state" == "ready" || ("$deploy_running" == "false" && "$health_ok" == "ok") ]]; then
                echo "Deploy finished successfully (sha ${deployed_sha}, attempt ${attempt})."
                exit 0
              fi
            fi

            if [[ "$deploy_running" == "false" && "$status_sha" == "$short_github_sha" && "$deployed_sha" != "$short_github_sha" && "$attempt" -ge 6 ]]; then
              echo "::warning::Webhook stalled (app=${deployed_sha:-unknown}, target=${short_github_sha}) — cron auto-deploy should recover within 5 min"
            fi

            if [[ "$app_offline" == "true" ]]; then
              echo "App offline during build (expected) — attempt ${attempt}/240"
            elif [[ "$deploy_running" == "true" ]]; then
              echo "Deploy in progress: deploySha=${deployed_sha:-unknown} state=${deploy_state:-$status_state} (attempt ${attempt}/240)"
            elif [[ "$deploy_state" =~ ^(started|pulling|building|restarting)$ || "$status_state" =~ ^(started|pulling|building|restarting)$ ]]; then
              echo "Deploy in progress: deploySha=${deployed_sha:-unknown} state=${deploy_state:-$status_state} (attempt ${attempt}/240)"
            elif [[ "$deploy_state" == "running" || "$status_state" == "running" ]]; then
              echo "Stale duplicate-block cleared — waiting for retry (attempt ${attempt}/240)"
            elif [[ "$attempt" == "12" || "$(( attempt % 30 ))" == "0" ]]; then
              echo "Waiting: deploySha=${deployed_sha:-unknown} target=${short_github_sha} (attempt ${attempt}/240, cron checks every 5 min)"
            fi

            sleep 10
          done

          echo "::error::Deploy did not reach commit ${short_github_sha} within 40 minutes"
          curl -fsS --max-time 15 "$STATUS_URL" 2>/dev/null || true
          echo ""
          echo "Check VPS cron log: sudo tail -f /var/log/newproject-auto-deploy.log"
          exit 1
