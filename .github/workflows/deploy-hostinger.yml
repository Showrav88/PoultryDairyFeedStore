name: Deploy to Hostinger VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: newproject-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate deployment secrets
        env:
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          VPS_DEPLOY_URL: ${{ secrets.VPS_DEPLOY_URL }}
        run: |
          missing=()
          [ -z "$DEPLOY_WEBHOOK_SECRET" ] && missing+=("DEPLOY_WEBHOOK_SECRET")
          [ -z "$VPS_DEPLOY_URL" ] && missing+=("VPS_DEPLOY_URL")

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing GitHub Actions secrets: ${missing[*]}"
            exit 1
          fi

      - name: Trigger VPS deploy webhook
        env:
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          VPS_DEPLOY_URL: ${{ secrets.VPS_DEPLOY_URL }}
        run: |
          set -euo pipefail
          BASE_URL="${VPS_DEPLOY_URL%/api/deploy}"
          HEALTH_URL="${BASE_URL}/api/health"
          STATUS_URL="${BASE_URL}/api/deploy/status"

          echo "Deploying commit ${GITHUB_SHA} via webhook"
          code=""
          body=""
          for attempt in $(seq 1 6); do
            echo "Webhook attempt ${attempt}/6 ..."
            response=$(curl -sS --connect-timeout 15 --max-time 45 -w "\nHTTP_CODE:%{http_code}" -X POST "$VPS_DEPLOY_URL" \
              -H "Authorization: Bearer ${DEPLOY_WEBHOOK_SECRET}" \
              -H "Content-Type: application/json" \
              -d "{\"ref\":\"${GITHUB_REF}\",\"sha\":\"${GITHUB_SHA}\"}" || true)

            body="${response%HTTP_CODE:*}"
            code="${response##*HTTP_CODE:}"
            echo "HTTP ${code:-000}"
            echo "$body"

            if [[ "$code" == "202" || "$code" == "200" ]]; then
              break
            fi
            if [[ "$attempt" -lt 6 ]]; then
              echo "Webhook not accepted yet, retrying in 20s (VPS may be restarting)..."
              sleep 20
            fi
          done

          if [[ "$code" != "202" && "$code" != "200" ]]; then
            echo "::error::Deploy webhook failed with HTTP ${code:-timeout}"
            exit 1
          fi

          short_github_sha="${GITHUB_SHA:0:7}"
          echo "Waiting for deploy to finish (target sha ${short_github_sha}) ..."

          for attempt in $(seq 1 120); do
            health_json=$(curl -fsS --max-time 10 "$HEALTH_URL" 2>/dev/null || true)
            status_json=$(curl -fsS --max-time 10 "$STATUS_URL" 2>/dev/null || true)

            if [[ -n "$health_json" ]]; then
              echo "$health_json"
              deployed_sha=$(echo "$health_json" | sed -n 's/.*"deploySha":"\([^"]*\)".*/\1/p')
              deploy_state=$(echo "$health_json" | sed -n 's/.*"deployState":"\([^"]*\)".*/\1/p')

              if [[ "$deploy_state" == "failed" ]]; then
                echo "::error::VPS deploy failed"
                echo "$status_json"
                exit 1
              fi

              if [[ -n "$deployed_sha" && "$deployed_sha" == "$short_github_sha" ]]; then
                echo "Deploy finished successfully (sha ${deployed_sha}, attempt ${attempt})."
                exit 0
              fi

              echo "Still deploying: deploySha=${deployed_sha:-unknown} state=${deploy_state:-unknown} (attempt ${attempt}/120)"
            else
              echo "Health not reachable yet (${attempt}/120)..."
            fi

            sleep 10
          done

          echo "::error::Deploy did not reach commit ${short_github_sha} within 20 minutes"
          echo "Deploy status:"
          curl -fsS --max-time 15 "$STATUS_URL" 2>/dev/null || true
          exit 1
