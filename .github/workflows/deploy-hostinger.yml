name: Deploy to Hostinger VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: newproject-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          missing=()
          [ -z "$VPS_HOST" ] && missing+=("VPS_HOST")
          [ -z "$VPS_USER" ] && missing+=("VPS_USER")
          [ -z "$VPS_SSH_KEY" ] && missing+=("VPS_SSH_KEY")
          [ -z "$VPS_KNOWN_HOSTS" ] && missing+=("VPS_KNOWN_HOSTS")

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing GitHub Actions secrets: ${missing[*]}"
            echo "Run on VPS: sudo bash /var/www/NEWPROJECT/deploy/setup-github-actions-deploy.sh"
            echo "Then add the printed values in GitHub → Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh

          # Normalize key: remove Windows CR, trim accidental leading spaces per line
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' | sed '/./s/^[[:space:]]*//' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            echo "::error::VPS_SSH_KEY is invalid (libcrypto error). Re-copy the private key from the VPS."
            echo "Must include BEGIN/END lines, no extra spaces at line start, no quotes."
            exit 1
          fi

          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' | sed '/./s/^[[:space:]]*//' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy main to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          echo "Deploying commit ${GITHUB_SHA} to ${VPS_USER}@${VPS_HOST}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "sudo /usr/local/sbin/deploy-newproject"
          echo "Deploy finished successfully."
