name: Deploy to Hostinger VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: newproject-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate deployment secrets
        env:
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          VPS_DEPLOY_URL: ${{ secrets.VPS_DEPLOY_URL }}
        run: |
          missing=()
          [ -z "$DEPLOY_WEBHOOK_SECRET" ] && missing+=("DEPLOY_WEBHOOK_SECRET")
          [ -z "$VPS_DEPLOY_URL" ] && missing+=("VPS_DEPLOY_URL")

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing GitHub Actions secrets: ${missing[*]}"
            exit 1
          fi

      - name: Trigger VPS deploy webhook
        env:
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          VPS_DEPLOY_URL: ${{ secrets.VPS_DEPLOY_URL }}
        run: |
          set -euo pipefail
          HEALTH_URL="${VPS_DEPLOY_URL%/api/deploy}/api/health"

          echo "Deploying commit ${GITHUB_SHA} via webhook"
          response=$(curl -sS --max-time 120 -w "\nHTTP_CODE:%{http_code}" -X POST "$VPS_DEPLOY_URL" \
            -H "Authorization: Bearer ${DEPLOY_WEBHOOK_SECRET}" \
            -H "Content-Type: application/json" \
            -d "{\"ref\":\"${GITHUB_REF}\",\"sha\":\"${GITHUB_SHA}\"}")

          body="${response%HTTP_CODE:*}"
          code="${response##*HTTP_CODE:}"
          echo "HTTP $code"
          echo "$body"

          if [[ "$code" != "202" && "$code" != "200" ]]; then
            echo "::error::Deploy webhook failed with HTTP $code"
            exit 1
          fi

          echo "Waiting for app health at $HEALTH_URL ..."
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 10 "$HEALTH_URL" >/dev/null; then
              echo "Health check passed (attempt $attempt)"
              echo "Deploy finished successfully."
              exit 0
            fi
            echo "Not healthy yet ($attempt/60)..."
            sleep 10
          done

          echo "::error::App did not become healthy within 10 minutes"
          exit 1
